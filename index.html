<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fukuda Architects</title>
    <style>
        /* CSS リセット & 基本設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            color: #333;
            background-color: #fff;
            overflow-x: hidden;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* ヘッダー・ナビゲーションバー */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            z-index: 1000;
            border-bottom: 1px solid #eaeaea;
        }
        .logo a {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }
        nav ul li a {
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            color: #666;
            transition: color 0.3s;
        }
        nav ul li a:hover {
            color: #000;
        }

        /* メインビジュアル（スクロール切り替えエリア） */
        .hero-section {
            position: relative;
            width: 100%;
            height: 200vh; /* スクロールスペースを確保 */
        }
        .hero-sticky {
            position: sticky;
            top: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* スライド（画像とテキストのセット） */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .slide.active {
            opacity: 1;
        }

        /* 背景画像 */
        .slide img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* 画像上の黒オーバーレイ（文字を読みやすくするため） */
        .slide::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        /* キャッチコピー */
        .hero-text {
            position: relative;
            z-index: 3;
            text-align: center;
            color: #fff;
            padding: 0 20px;
        }
        .hero-text h1 {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            line-height: 1.6;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* レスポンシブ対応（スマホ向け） */
        @media (max-width: 768px) {
            header {
                padding: 0 20px;
                height: 60px;
            }
            .logo a {
                font-size: 1rem;
            }
            nav ul {
                gap: 1rem;
            }
            nav ul li a {
                font-size: 0.8rem;
            }
            .hero-text h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- ヘッダー / ナビゲーションバー -->
    <header>
        <div class="logo">
            <a href="./index.html">Fukuda Architects</a>
        </div>
        <nav>
            <ul>
                <li><a href="./about.html">About</a></li>
                <li><a href="./works.html">Works</a></li>
                <li><a href="./contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- メインセクション（スクロール連動切り替え） -->
    <section class="hero-section" id="heroSection">
        <div class="hero-sticky">
            <!-- 1枚目のスライド -->
            <div class="slide active" id="slide1">
                <!-- サンプル画像（ご自身で用意した画像ファイル名に変更してください） -->
                <img src="images/hero-1.jpg" alt="Fukuda Architects Project 1">
                <div class="hero-text">
                    <h1>光と影を編む、<br>静謐な建築空間。</h1>
                </div>
            </div>

            <!-- 2枚目のスライド -->
            <div class="slide" id="slide2">
                <!-- サンプル画像（ご自身で用意した画像ファイル名に変更してください） -->
                <img src="images/hero-2.jpg" alt="Fukuda Architects Project 2">
                <div class="hero-text">
                    <h1>風景と対話し、<br>時とともに深まるデザイン。</h1>
                </div>
            </div>
        </div>
    </section>

    <!-- スクリプト：スクロール位置に応じて画像を切り替える -->
    <script>
        const section = document.getElementById('heroSection');
        const slide1 = document.getElementById('slide1');
        const slide2 = document.getElementById('slide2');

        window.addEventListener('scroll', () => {
            const rect = section.getBoundingClientRect();
            const sectionHeight = section.offsetHeight;
            const windowHeight = window.innerHeight;

            // スクロールが進んだ割合を計算 (0から1の間)
            let scrollProgress = -rect.top / (sectionHeight - windowHeight);
            
            if (scrollProgress >= 0.5) {
                slide1.classList.remove('active');
                slide2.classList.add('active');
            } else {
                slide1.classList.add('active');
                slide2.classList.remove('active');
            }
        });
    </script>
</body>
</html>
