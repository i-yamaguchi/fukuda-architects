<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fukuda Architects</title>
    <style>
        /* CSS リセット & 基本設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            color: #333;
            background-color: #fff;
            overflow-x: hidden;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* ヘッダー・ナビゲーションバー */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
            z-index: 1000;
            border-bottom: 1px solid #eaeaea;
        }
        .logo a {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }
        nav ul li a {
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            color: #666;
            transition: color 0.3s;
        }
        nav ul li a:hover {
            color: #000;
        }

        /* メインビジュアル（スライドショーエリア） */
        .hero-section {
            position: relative;
            width: 100vw;
            height: calc(100vh - 70px);
            margin-top: 70px;
            overflow: hidden;
        }

        /* スライド */
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        /* 背景画像 */
        .slide img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* 画像上の黒オーバーレイ */
        .slide::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.35);
            z-index: 2;
        }

        /* キャッチコピー */
        .hero-text {
            position: relative;
            z-index: 3;
            text-align: center;
            color: #fff;
            padding: 0 20px;
        }
        .hero-text h1 {
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            line-height: 1.6;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* --- 左右の切り替え矢印ボタン --- */
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, transform 0.2s;
            backdrop-filter: blur(4px);
        }
        .slider-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        .prev-btn {
            left: 30px;
        }
        .next-btn {
            right: 30px;
        }

        /* --- 下部インジケーター（直接指定アイコン） --- */
        .slider-dots {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 12px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            border: none;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .dot.active {
            background: #fff;
            transform: scale(1.2);
        }

        /* レスポンシブ対応（スマホ向け） */
        @media (max-width: 768px) {
            header {
                padding: 0 20px;
                height: 60px;
            }
            .hero-section {
                height: calc(100vh - 60px);
                margin-top: 60px;
            }
            .logo a {
                font-size: 1rem;
            }
            nav ul {
                gap: 1rem;
            }
            nav ul li a {
                font-size: 0.8rem;
            }
            .hero-text h1 {
                font-size: 1.3rem;
            }
            .slider-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
            .prev-btn {
                left: 15px;
            }
            .next-btn {
                right: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- ヘッダー / ナビゲーションバー -->
    <header>
        <div class="logo">
            <a href="./index.html">Fukuda Architects</a>
        </div>
        <nav>
            <ul>
                <li><a href="./about.html">About</a></li>
                <li><a href="./works.html">Works</a></li>
                <li><a href="./contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- メインセクション（4枚のスライドショー） -->
    <section class="hero-section">
        <!-- スライド1: hero-1 -->
        <div class="slide active" data-index="0">
            <img src="images/hero-1.jpg" alt="Fukuda Architects Project 1">
            <div class="hero-text">
                <h1>光と影を編む、<br>静謐な建築空間。</h1>
            </div>
        </div>

        <!-- スライド2: 代表のポートレート -->
        <div class="slide" data-index="1">
            <img src="images/president.png" alt="代表者プロフィール">
            <div class="hero-text">
                <h1>想いをカタチに、<br>未来へ繋ぐ建築。</h1>
            </div>
        </div>

        <!-- スライド3: hero-2 （パターン3の文章適用） -->
        <div class="slide" data-index="2">
            <img src="images/hero-2.jpg" alt="Fukuda Architects Project 2">
            <div class="hero-text">
                <h1>無限の宇宙を内包した魂が、静かに、そして激しく爆ぜる。<br>私という超新星の閃光で、世界の美しさを再定義する。</h1>
            </div>
        </div>

        <!-- スライド4: 代表の枠持ち画像 -->
        <div class="slide" data-index="3">
            <img src="images/president.png" alt="代表者 枠持ち写真">
            <div class="hero-text">
                <h1>自分で決めた限界の枠なんて、ぶち抜け。<br>既成概念の枠にも囚われない、唯一無二の建築を。</h1>
            </div>
        </div>

        <!-- 左右の矢印ボタン -->
        <button class="slider-btn prev-btn" id="prevBtn" aria-label="前のスライドへ">&#10094;</button>
        <button class="slider-btn next-btn" id="nextBtn" aria-label="次のスライドへ">&#10095;</button>

        <!-- 下部インジケーター（直接指定アイコン） -->
        <div class="slider-dots" id="sliderDots">
            <button class="dot active" data-index="0" aria-label="スライド1"></button>
            <button class="dot" data-index="1" aria-label="スライド2"></button>
            <button class="dot" data-index="2" aria-label="スライド3"></button>
            <button class="dot" data-index="3" aria-label="スライド4"></button>
        </div>
    </section>

    <!-- スクリプト：スライドショーのコントロール -->
    <script>
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        let currentIndex = 0;
        const totalSlides = slides.length;

        function showSlide(index) {
            // インデックスのループ処理
            if (index < 0) {
                currentIndex = totalSlides - 1;
            } else if (index >= totalSlides) {
                currentIndex = 0;
            } else {
                currentIndex = index;
            }

            // すべてのスライドとドットから active を外す
            slides.forEach(slide => slide.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));

            // 現在のインデックスに active を付与
            slides[currentIndex].classList.add('active');
            dots[currentIndex].classList.add('active');
        }

        // 次へボタン
        nextBtn.addEventListener('click', () => {
            showSlide(currentIndex + 1);
        });

        // 前へボタン
        prevBtn.addEventListener('click', () => {
            showSlide(currentIndex - 1);
        });

        // ドットクリックによる直接指定
        dots.forEach(dot => {
            dot.addEventListener('click', () => {
                const targetIndex = parseInt(dot.getAttribute('data-index'));
                showSlide(targetIndex);
            });
        });
    </script>
</body>
</html>
