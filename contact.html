<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Fukuda Architects</title>
    <style>
        /* CSS リセット & 基本設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            color: #333;
            background-color: #fff;
            overflow-x: hidden;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* ヘッダー・ナビゲーションバー（全ページ共通） */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            z-index: 1000;
            border-bottom: 1px solid #eaeaea;
        }
        .logo a {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }
        nav ul li a {
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            color: #666;
            transition: color 0.3s;
        }
        nav ul li a:hover, nav ul li a.active {
            color: #000;
        }

        /* お問い合わせメインセクション */
        .contact-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px);
            margin-top: 70px;
            padding: 0 5%;
            background-color: #fafafa;
        }

        .contact-box {
            max-width: 700px;
            width: 100%;
            background: #fff;
            padding: 60px 50px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid #eaeaea;
        }

        .contact-box h2 {
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 1.5rem;
        }

        .contact-message {
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: #222;
            line-height: 1.8;
            margin-bottom: 2rem;
        }

        .contact-subtext {
            font-size: 0.95rem;
            color: #666;
            letter-spacing: 0.03em;
            line-height: 1.6;
        }

        /* レスポンシブ対応（スマホ向け） */
        @media (max-width: 768px) {
            .contact-box {
                padding: 40px 20px;
            }
            .contact-message {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- ヘッダー / ナビゲーションバー -->
    <header>
        <div class="logo">
            <a href="./index.html">Fukuda Architects</a>
        </div>
        <nav>
            <ul>
                <li><a href="./about.html">About</a></li>
                <li><a href="./works.html">Works</a></li>
                <li><a href="./contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- お問い合わせメインコンテンツ -->
    <main class="contact-container">
        <div class="contact-box">
            <h2>Contact</h2>
            <p class="contact-message">会場内の本人へ直接ご質問ください</p>
            <p class="contact-subtext">
                展示物や設計に関するご質問、お気づきの点がございましたら、<br>
                お気軽に本人へお声がけください。
            </p>
        </div>
    </main>

</body>
</html>
