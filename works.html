<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works - Fukuda Architects</title>
    <style>
        /* CSS リセット & 基本設定 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            color: #333;
            background-color: #fff;
            overflow-x: hidden;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* ヘッダー・ナビゲーションバー（全ページ共通） */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(5px);
            z-index: 1000;
            border-bottom: 1px solid #eaeaea;
        }
        .logo a {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }
        nav ul li a {
            font-size: 0.9rem;
            letter-spacing: 0.05em;
            color: #666;
            transition: color 0.3s;
        }
        nav ul li a:hover, nav ul li a.active {
            color: #000;
        }

        /* 施工事例メインレイアウト（左右2ペイン構造） */
        .works-container {
            display: flex;
            min-height: calc(100vh - 70px);
            margin-top: 70px;
            padding: 5vh 5%;
            gap: 5%;
            align-items: center;
        }

        /* 左ペイン：事例名リスト */
        .works-sidebar {
            flex: 0 0 40%;
            padding-right: 20px;
        }
        .works-title-heading {
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 2rem;
        }
        .works-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .works-item-link {
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: #999;
            cursor: pointer;
            transition: color 0.3s, padding-left 0.3s;
            display: inline-block;
            position: relative;
        }
        .works-item-link:hover {
            color: #333;
        }
        .works-item-link.active {
            color: #111;
            font-weight: 500;
            padding-left: 15px;
        }
        .works-item-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background-color: #111;
            border-radius: 50%;
        }

        /* 右ペイン：画像表示エリア */
        .works-viewer {
            flex: 1;
            height: 65vh;
            position: relative;
            background-color: #f7f7f7;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .work-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease-in-out, visibility 0.6s ease-in-out;
            object-fit: cover;
        }
        .work-image.active {
            opacity: 1;
            visibility: visible;
        }

        /* レスポンシブ対応（スマホ向け：縦並びに変更） */
        @media (max-width: 900px) {
            .works-container {
                flex-direction: column-reverse;
                padding: 30px 20px;
                gap: 2rem;
            }
            .works-sidebar {
                flex: none;
                width: 100%;
                padding-right: 0;
            }
            .works-item-link {
                font-size: 1.2rem;
            }
            .works-viewer {
                width: 100%;
                height: 45vh;
            }
        }
    </style>
</head>
<body>

    <!-- ヘッダー / ナビゲーションバー -->
    <header>
        <div class="logo">
            <a href="./index.html">Fukuda Architects</a>
        </div>
        <nav>
            <ul>
                <li><a href="./about.html">About</a></li>
                <li><a href="./works.html" class="active">Works</a></li>
                <li><a href="./contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- 施工事例 メインコンテンツ -->
    <main class="works-container">
        <!-- 左ペイン：事例名リスト -->
        <div class="works-sidebar">
            <div class="works-title-heading">Works</div>
            <ul class="works-list">
                <li><span class="works-item-link active" data-target="work1">小澤様邸</span></li>
                <li><span class="works-item-link" data-target="work2">福岡高等技術専門校</span></li>
            </ul>
        </div>

        <!-- 右ペイン：画像ビューア -->
        <div class="works-viewer">
            <!-- 1番目の事例画像（デフォルト表示） -->
            <img src="images/work-ozawa.jpg" alt="小澤様邸" class="work-image active" id="work1">
            <!-- 2番目の事例画像 -->
            <img src="images/work-fukuoka.jpg" alt="福岡高等技術専門校" class="work-image" id="work2">
        </div>
    </main>

    <!-- スクリプト：クリック時に画像を切り替える -->
    <script>
        const links = document.querySelectorAll('.works-item-link');
        const images = document.querySelectorAll('.work-image');

        links.forEach(link => {
            link.addEventListener('click', () => {
                const targetId = link.getAttribute('data-target');

                // すべてのリンクと画像から active クラスを削除
                links.forEach(l => l.classList.remove('active'));
                images.forEach(img => img.classList.remove('active'));

                // クリックされた項目に active クラスを付与
                link.classList.add('active');
                document.getElementById(targetId).classList.add('active');
            });
        });
    </script>
</body>
</html>
